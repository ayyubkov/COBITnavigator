<title>COBIT 2019 Navigator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,800&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky toolbar, persistent objective index on the left, one working pane on the right. Domain hue is the only strong color. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf2; --ink:#18202b; --muted:#5a6575; --line:#d6dce4; --accent:#2346a8;
  --edm:#4b4fbf; --apo:#0d7a75; --bai:#a2650a; --dss:#b0405a; --mea:#4d7a1c;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --sunk:#1e2731; --ink:#e4e9f0; --muted:#97a3b3; --line:#2b3542; --accent:#8fa9ff;
  --edm:#a3a6f5; --apo:#4cc7bf; --bai:#e8b558; --dss:#f08ea2; --mea:#a8d46c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --sunk:#1e2731; --ink:#e4e9f0; --muted:#97a3b3; --line:#2b3542; --accent:#8fa9ff;
  --edm:#a3a6f5; --apo:#4cc7bf; --bai:#e8b558; --dss:#f08ea2; --mea:#a8d46c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono)}
.d-EDM{--dc:var(--edm)} .d-APO{--dc:var(--apo)} .d-BAI{--dc:var(--bai)} .d-DSS{--dc:var(--dss)} .d-MEA{--dc:var(--mea)}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.brand{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:17px;letter-spacing:.01em;text-decoration:none;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;background:var(--sunk);border-radius:var(--r);padding:3px}
.tabs a{text-decoration:none;padding:5px 12px;border-radius:4px;font-weight:500;font-size:14px;color:var(--muted)}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{position:relative;flex:1 1 260px;min-width:0}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 12px 32px rgba(10,20,40,.18);max-height:min(70vh,520px);overflow:auto;padding:6px;z-index:20}
.results h6{margin:8px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.results a{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:4px;text-decoration:none}
.results a:hover,.results a.sel{background:var(--sunk)}
.results .code{font-family:var(--mono);font-size:12.5px;color:var(--dc);font-weight:600;flex:none;min-width:68px}
.results .sub{color:var(--muted);font-size:12.5px}
.results .none{padding:12px;color:var(--muted)}
.idx-btn{display:none;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:6px 10px;font-size:14px;cursor:pointer}

/* shell */
.app{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1400px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;max-height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow:auto;
  padding-block:18px 40px;padding-right:16px;border-right:1px solid var(--line)}
.index details{margin-bottom:6px}
.index summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.index summary::-webkit-details-marker{display:none}
.index summary::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dc);flex:none}
.index summary span{margin-left:auto;font-family:var(--mono);font-weight:400}
.index ol{list-style:none;margin:2px 0 8px;padding:0}
.index li a{display:flex;gap:8px;padding:4px 8px;border-radius:4px;text-decoration:none;font-size:13.5px;line-height:1.35}
.index li a b{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--dc);flex:none;padding-top:1px}
.index li a:hover{background:var(--sunk)}
.index li a[aria-current="page"]{background:color-mix(in srgb,var(--dc) 14%,transparent)}
main{min-width:0;padding:24px 0 64px 32px}

/* shared */
h1,h2,h3{font-family:var(--display);font-stretch:112%;text-wrap:balance;margin:0}
h1{font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1.12}
h2{font-weight:600;font-size:18px;margin-bottom:12px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{color:var(--muted);max-width:68ch;margin:8px 0 0}
section{margin-top:34px}
.chip{display:inline-flex;align-items:baseline;gap:7px;padding:4px 9px;border:1px solid var(--line);border-radius:4px;background:var(--surface);text-decoration:none;font-size:13.5px;line-height:1.3}
.chip b{font-family:var(--mono);font-size:12px;color:var(--dc,var(--accent));font-weight:600}
a.chip:hover{border-color:var(--dc,var(--accent))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;max-width:80ch}

/* map */
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:13.5px;color:var(--muted)}
.stats b{font-family:var(--mono);color:var(--ink);font-weight:600;margin-right:4px}
.model{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px;margin-top:22px}
.band{border:1px solid var(--line);border-top:3px solid var(--dc);background:var(--surface);border-radius:var(--r);padding:12px;min-width:0}
.band.edm{grid-column:1/-1}
.band.mea{grid-column:2;grid-row:2/5}
.band header{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.band header b{font-family:var(--mono);color:var(--dc);font-size:13px}
.band header span{font-weight:600;font-size:14px}
.band header em{font-style:normal;color:var(--muted);font-size:12.5px;margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.band.mea .tiles{grid-template-columns:1fr}
.tile{display:flex;flex-direction:column;gap:4px;padding:9px 10px;border-radius:4px;background:color-mix(in srgb,var(--dc) 9%,var(--surface));text-decoration:none;border:1px solid transparent;min-height:74px;transition:border-color .12s,transform .12s}
.tile:hover{border-color:var(--dc);transform:translateY(-1px)}
.tile b{font-family:var(--mono);font-size:12.5px;color:var(--dc)}
.tile span{font-size:13px;line-height:1.3}
.tile.dim{opacity:.28}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.howto div{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.howto h3{font-size:15px;font-weight:600;margin-bottom:4px}
.howto p{margin:0;color:var(--muted);font-size:13.5px}

/* objective */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.ohead{display:flex;gap:18px;align-items:flex-start;margin-top:10px;flex-wrap:wrap}
.ocode{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--surface);background:var(--dc);padding:6px 10px;border-radius:4px;flex:none;margin-top:4px}
.ohead > div{flex:1 1 300px;min-width:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pager{display:flex;gap:6px;margin-left:auto}
.pager a{border:1px solid var(--line);border-radius:4px;padding:4px 10px;text-decoration:none;font-size:13px;background:var(--surface);white-space:nowrap}
.pager a:hover{border-color:var(--dc)}
.prose{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:24px}
.prose p{margin:4px 0 0;max-width:62ch}
.cascade{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:10px;align-items:start}
.cascade .arrow{align-self:center;text-align:center;color:var(--muted);font-size:18px}
.goal{display:flex;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);text-decoration:none;font-size:13.5px;line-height:1.35;margin-bottom:6px}
.goal b{font-family:var(--mono);font-size:12px;color:var(--accent);flex:none;padding-top:1px}
.goal:hover{border-color:var(--accent)}

.prac{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.prow{display:grid;grid-template-columns:76px minmax(0,1fr) 150px minmax(0,190px) 22px;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.prac > div:first-child .prow{border-top:0}
.prow:hover{background:var(--sunk)}
.prow .pc{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--dc)}
.prow .pn{font-weight:500}
.prow .acc{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .acc strong{color:var(--ink);font-weight:600}
.prow .chev{color:var(--muted);transition:transform .15s}
.prow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.phead{display:grid;grid-template-columns:76px minmax(0,1fr) 150px minmax(0,190px) 22px;gap:14px;padding:0 14px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cap{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.cap i{font-style:normal;font-family:var(--mono);font-size:11px;text-align:center;padding:3px 0;border-radius:2px;background:var(--sunk);color:var(--muted)}
.cap i.on{background:color-mix(in srgb,var(--dc) calc(var(--w)*1%),var(--sunk));color:var(--ink);font-weight:600}
.pdet{padding:4px 14px 16px 104px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;font-size:13.5px}
.pdet h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pdet ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.pdet li{padding:2px 8px;border-radius:3px;background:var(--sunk);font-size:12.5px}
.pdet li.a{background:color-mix(in srgb,var(--dc) 20%,var(--sunk));font-weight:600}
.pdet .lvls{color:var(--muted)}
.pdet button.role{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.comp{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.comp h3{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.comp h3 span{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.comp ul{margin:0;padding-left:18px;font-size:13.5px}
.comp li{margin:2px 0}
.comp p{margin:0;font-size:13.5px}
.legend{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}

/* goals + roles */
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.focus{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.focus h2{margin-bottom:4px}
.focus p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.mx-wrap{overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.mx{border-collapse:collapse;font-size:12.5px;width:100%;font-variant-numeric:tabular-nums}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:0;text-align:center}
.mx thead th{position:sticky;top:0;background:var(--surface);font-family:var(--mono);font-weight:600;font-size:11.5px}
.mx thead th button{border:0;background:none;padding:8px 4px;width:100%;cursor:pointer;color:var(--muted);font:inherit}
.mx thead th.sel button{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.mx td.sel,.mx th.sel{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.mx th[scope=row]{text-align:left;position:sticky;left:0;background:var(--surface);white-space:nowrap;padding:5px 12px;font-weight:400;min-width:210px}
.mx th[scope=row] a{text-decoration:none}
.mx th[scope=row] b{font-family:var(--mono);color:var(--dc);font-size:12px;margin-right:8px}
.mx .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dc)}
.mx td{min-width:38px}
.mx tr:hover th[scope=row],.mx tr:hover td{background:var(--sunk)}
.rolelist{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.rolelist button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 9px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:baseline}
.rolelist button span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rolelist button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.rgroup{margin-top:14px}
.rgroup h3{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.rgroup h3 a{text-decoration:none}
.rgroup h3 b{font-family:var(--mono);font-size:12px;color:var(--dc)}
.rgroup ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.rgroup li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;padding:7px 12px;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.rgroup li:first-child{border-top:0}
.rgroup li a{text-decoration:none}
.rgroup li a:hover{text-decoration:underline}
.rgroup .pc{font-family:var(--mono);font-size:12px;color:var(--dc);font-weight:600}
.ar{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;border:1px solid var(--line)}
.ar.A{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dbars{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--sunk);margin:10px 0 4px;max-width:520px}
.dbars i{display:block;background:var(--dc)}
.dleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.dleg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--dc);margin-right:5px}

/* narrow */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .idx-btn{display:inline-block}
  .index{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);max-height:none;z-index:30;background:var(--surface);
    padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    transform:translateX(-102%);visibility:hidden;transition:transform .2s,visibility .2s}
  .index.open{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .rolelist{max-height:220px;overflow:auto;padding:2px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  main{padding:20px 0 56px}
  .model{grid-template-columns:minmax(0,1fr)}
  .band.mea{grid-column:auto;grid-row:auto}
  .band.mea .tiles{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
  .phead{display:none}
  .prow{grid-template-columns:70px minmax(0,1fr) 22px;row-gap:6px}
  .prow .cap{grid-column:2;max-width:200px}
  .prow .acc{grid-column:2;white-space:normal}
  .prow .chev{grid-row:1;grid-column:3}
  .pdet{padding-left:14px}
  .cascade{grid-template-columns:minmax(0,1fr)}
  .cascade .arrow{transform:rotate(90deg)}
}
@media (max-width:560px){ .brand small{display:none} .search{order:3;flex-basis:100%} .search kbd{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="bar-in">
    <button class="idx-btn" id="idxBtn" aria-controls="index" aria-expanded="false">Index</button>
    <a class="brand" href="#map">COBIT 2019 Navigator <small>Core model</small></a>
    <nav class="tabs" aria-label="Views">
      <a href="#map" data-v="map">Map</a>
      <a href="#goals" data-v="goals">Goals</a>
      <a href="#roles" data-v="roles">Roles</a>
    </nav>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search objectives, practices, roles, skills, policies…" autocomplete="off" aria-label="Search">
      <kbd>/</kbd>
      <div class="results" id="results" hidden></div>
    </div>
  </div>
</header>

<div class="app">
  <nav class="index" id="index" aria-label="All objectives"></nav>
  <main id="main"></main>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const O=D.obj, BY={}, PR={};
O.forEach((o,i)=>{o.i=i;BY[o.id]=o;o.pr.forEach(p=>{p.o=o;PR[p.id]=p})});
const DOMS=Object.keys(D.domains);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const main=$('#main');
const nPr=O.reduce((a,o)=>a+o.pr.length,0);
const nAct=O.reduce((a,o)=>a+o.pr.reduce((b,p)=>b+Object.values(p.lv).reduce((x,y)=>x+y,0),0),0);

// roles
const ROLES={};
O.forEach(o=>o.pr.forEach(p=>{
  p.A.forEach(r=>{(ROLES[r]=ROLES[r]||{A:[],R:[]}).A.push(p)});
  p.R.forEach(r=>{(ROLES[r]=ROLES[r]||{A:[],R:[]}).R.push(p)});
}));
const roleNames=Object.keys(ROLES).sort((a,b)=>(ROLES[b].A.length+ROLES[b].R.length)-(ROLES[a].A.length+ROLES[a].R.length));
const state={goalKind:'ag',goal:'AG07',role:'Chief Information Officer',roleFilter:'all',open:{}};
try{const s=JSON.parse(localStorage.getItem('cobitnav')||'{}');Object.assign(state,s)}catch(e){}
const save=()=>{try{localStorage.setItem('cobitnav',JSON.stringify({goalKind:state.goalKind,goal:state.goal,role:state.role,roleFilter:state.roleFilter}))}catch(e){}};

// index
function buildIndex(){
  $('#index').innerHTML=DOMS.map(d=>{
    const os=O.filter(o=>o.d===d);
    return `<details class="d-${d}" open><summary>${d} · ${esc(D.domains[d].split(',')[0])}<span>${os.length}</span></summary><ol>`+
      os.map(o=>`<li><a href="#${o.id}" data-id="${o.id}"><b>${o.id.slice(3)}</b>${esc(o.n)}</a></li>`).join('')+`</ol></details>`}).join('');
}
const chip=o=>`<a class="chip d-${o.d}" href="#${o.id}"><b>${o.id}</b>${esc(o.n)}</a>`;
const foot=`<p class="foot">Unofficial study aid built from <i>COBIT® 2019 Framework: Governance and Management Objectives</i>. COBIT® is a registered trademark of ISACA. Summaries here are paraphrased; practice names, goals and RACI assignments are taken from the publication. Page numbers point to the official PDF for the full activities, metrics and guidance.</p>`;

// map
function renderMap(){
  const band=d=>{const os=O.filter(o=>o.d===d);return `<div class="band ${d.toLowerCase()} d-${d}"><header><b>${d}</b><span>${esc(D.domains[d])}</span><em>${os.length} objectives</em></header><div class="tiles">`+
    os.map(o=>`<a class="tile" href="#${o.id}"><b>${o.id}</b><span>${esc(o.n.replace(/^(Managed|Ensured) /,''))}</span></a>`).join('')+`</div></div>`};
  main.innerHTML=`<p class="eyebrow">The COBIT core model</p>
  <h1>40 objectives for governing and managing enterprise I&amp;T</h1>
  <p class="lede">One governance domain sets direction; four management domains plan, build, run and monitor. Open any objective to see its goals, practices, who is accountable, and the components that support it.</p>
  <div class="stats"><span><b>5</b>domains</span><span><b>40</b>objectives</span><span><b>${nPr}</b>practices</span><span><b>${nAct.toLocaleString()}</b>activities</span><span><b>${roleNames.length}</b>roles in the RACI charts</span></div>
  <div class="model">${band('EDM')}${band('APO')}${band('BAI')}${band('DSS')}${band('MEA')}</div>
  <section><h2>Ways to use this</h2><div class="howto">
    <div><h3>Study one objective</h3><p>Click a tile. Practices expand to show capability levels and the full Accountable / Responsible list.</p></div>
    <div><h3>Trace the goals cascade</h3><p>The Goals view maps the 13 enterprise goals and 13 alignment goals to the objectives that support them.</p></div>
    <div><h3>Think like a role</h3><p>The Roles view lists every practice a given role owns, like the CIO, CISO or business process owners.</p></div>
    <div><h3>Jump anywhere</h3><p>Press <span class="mono">/</span> and type a code (APO12.03), a role, a skill, a policy or a tool.</p></div>
  </div></section>${foot}`;
}

// objective
const capCells=(lv,big)=>{const mx=Math.max(...Object.values(lv));return `<div class="cap" title="Activities per capability level">`+[1,2,3,4,5].map(l=>{const n=lv[l]||0;return n?`<i class="on" style="--w:${Math.round(25+75*n/mx)}">${n}</i>`:`<i>·</i>`}).join('')+`</div>`};
function renderObj(id,openPr){
  const o=BY[id], prev=O[o.i-1], next=O[o.i+1];
  const lvTotal=o.pr.reduce((a,p)=>a+Object.values(p.lv).reduce((x,y)=>x+y,0),0);
  main.className='d-'+o.d;
  main.innerHTML=`<div class="crumbs"><a href="#map">Map</a><span>›</span><span>${esc(D.domains[o.d])}</span></div>
  <div class="ohead"><span class="ocode">${o.id}</span><div><h1>${esc(o.n)}</h1>
   <div class="meta"><span class="pill">${o.t==='G'?'Governance objective':'Management objective'}</span><span class="pill">${o.pr.length} practices · ${lvTotal} activities</span><span class="pill">PDF p. ${o.pg}</span>
   <span class="pager">${prev?`<a href="#${prev.id}" title="${esc(prev.n)}">← ${prev.id}</a>`:''}${next?`<a href="#${next.id}" title="${esc(next.n)}">${next.id} →</a>`:''}</span></div></div></div>
  <div class="prose"><div><p class="eyebrow">What it covers</p><p>${esc(o.s)}</p></div><div><p class="eyebrow">Why it matters</p><p>${esc(o.p)}</p></div></div>
  <section><h2>Goals cascade</h2><p class="legend">The primary enterprise goals and alignment goals this objective supports. Click one to see every objective behind it.</p>
   <div class="cascade"><div><p class="eyebrow" style="margin-bottom:6px">Enterprise goals</p>${o.eg.map(g=>`<a class="goal" href="#goals" data-goal="${g}"><b>${g}</b>${esc(D.eg[g])}</a>`).join('')}</div>
   <div class="arrow" aria-hidden="true">→</div>
   <div><p class="eyebrow" style="margin-bottom:6px">Alignment goals</p>${o.ag.map(g=>`<a class="goal" href="#goals" data-goal="${g}"><b>${g}</b>${esc(D.ag[g])}</a>`).join('')}</div></div></section>
  <section><h2>${o.t==='G'?'Governance':'Management'} practices</h2>
   <p class="legend">Each cell is a capability level (1–5); the number is how many activities sit at that level. Higher-level activities only count once the lower ones are in place.</p>
   <div class="phead"><span>Code</span><span>Practice</span><span>Capability 1–5</span><span>Accountable</span><span></span></div>
   <div class="prac">${o.pr.map(p=>`<div id="p-${p.id.replace('.','-')}"><button class="prow" aria-expanded="false" data-p="${p.id}">
     <span class="pc">${p.id}</span><span class="pn">${esc(p.n)}</span>${capCells(p.lv)}<span class="acc">A: <strong>${esc(p.A.join(', '))}</strong></span><span class="chev" aria-hidden="true">›</span></button>
     <div class="pdet" hidden><div><h4>Accountable</h4><ul>${p.A.map(r=>`<li class="a"><button class="role" data-role="${esc(r)}">${esc(r)}</button></li>`).join('')}</ul></div>
     <div><h4>Responsible (${p.R.length})</h4><ul>${p.R.map(r=>`<li><button class="role" data-role="${esc(r)}">${esc(r)}</button></li>`).join('')||'<li>None listed</li>'}</ul></div>
     <div><h4>Activities</h4><p class="lvls">${Object.entries(p.lv).map(([l,n])=>`${n} at level ${l}`).join(', ')}. Full activity text and example metrics on PDF p. ${p.pg}.</p></div></div></div>`).join('')}</div></section>
  <section><h2>Supporting components</h2><div class="comps">
   <div class="comp"><h3>Skills <span>${o.sk.length}</span></h3><ul>${o.sk.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
   <div class="comp"><h3>Policies &amp; principles <span>${o.po.length}</span></h3><ul>${o.po.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
   <div class="comp"><h3>Culture &amp; behavior</h3><p>${esc(o.c)}</p></div>
   <div class="comp"><h3>Services, infrastructure &amp; apps <span>${o.sv.length}</span></h3>${o.sv.length?`<ul>${o.sv.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'<p style="color:var(--muted)">None listed for this objective.</p>'}</div>
  </div></section>
  <section><h2>Connected objectives</h2><p class="legend">Objectives that send inputs to, or receive outputs from, ${o.id}'s practices (information flows).</p><div class="chips">${o.ln.map(c=>chip(BY[c])).join('')}</div></section>
  ${foot}`;
  if(openPr){const b=main.querySelector(`[data-p="${openPr}"]`);if(b){togglePr(b,true);setTimeout(()=>b.scrollIntoView({block:'center'}),0)}}
}
function togglePr(b,force){const d=b.nextElementSibling;const on=force??b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',on);d.hidden=!on}

// goals
function renderGoals(){
  main.className='';
  const k=state.goalKind, G=D[k], ids=Object.keys(G);
  if(!G[state.goal]) state.goal=ids[0];
  const g=state.goal, sup=O.filter(o=>o[k].includes(g));
  main.innerHTML=`<p class="eyebrow">Goals cascade</p><h1>Which objectives serve which goals</h1>
  <p class="lede">Stakeholder needs drive enterprise goals, enterprise goals drive alignment goals, and alignment goals drive the objectives. Dots mark a primary link listed in each objective's detail.</p>
  <div style="margin-top:16px" class="seg" role="group" aria-label="Goal type"><button data-gk="eg" aria-pressed="${k==='eg'}">Enterprise goals (EG)</button><button data-gk="ag" aria-pressed="${k==='ag'}">Alignment goals (AG)</button></div>
  <div class="focus"><p class="eyebrow">${g}</p><h2>${esc(G[g])}</h2><p>${sup.length} objectives list this as a primary goal.</p><div class="chips">${sup.map(chip).join('')}</div></div>
  <div class="mx-wrap"><table class="mx"><thead><tr><th scope="col" style="text-align:left;padding-left:12px">Objective</th>${ids.map(x=>`<th scope="col" class="${x===g?'sel':''}"><button data-goal-col="${x}" title="${esc(G[x])}">${x.slice(2)}</button></th>`).join('')}</tr></thead>
  <tbody>${O.map(o=>`<tr class="d-${o.d}"><th scope="row"><a href="#${o.id}"><b>${o.id}</b>${esc(o.n)}</a></th>${ids.map(x=>`<td class="${x===g?'sel':''}">${o[k].includes(x)?`<span class="dot" title="${o.id} → ${x}"></span>`:''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <section><h2>${k==='eg'?'Enterprise':'Alignment'} goals</h2><div class="chips">${ids.map(x=>`<button class="chip" data-goal-col="${x}" style="cursor:pointer${x===g?';border-color:var(--accent)':''}"><b>${x}</b>${esc(G[x])}</button>`).join('')}</div></section>${foot}`;
}

// roles
function renderRoles(){
  main.className='';
  if(!ROLES[state.role]) state.role=roleNames[0];
  const r=state.role, R=ROLES[r], f=state.roleFilter;
  const items=[...R.A.map(p=>({p,t:'A'})),...R.R.map(p=>({p,t:'R'}))].filter(x=>f==='all'||x.t===f);
  const byO={};items.forEach(x=>{(byO[x.p.o.id]=byO[x.p.o.id]||[]).push(x)});
  const oids=Object.keys(byO).sort((a,b)=>BY[a].i-BY[b].i);
  oids.forEach(id=>byO[id].sort((a,b)=>a.p.id<b.p.id?-1:1));
  const dcount=DOMS.map(d=>[d,items.filter(x=>x.p.o.d===d).length]);
  const tot=items.length||1;
  main.innerHTML=`<p class="eyebrow">RACI by role</p><h1>What each role is on the hook for</h1>
  <p class="lede">From the organizational-structures chart of every practice. <b>A</b> means accountable (exactly one per practice); <b>R</b> means responsible for doing the work.</p>
  <div class="rolelist">${roleNames.map(n=>`<button data-r="${esc(n)}" aria-pressed="${n===r}">${esc(n)}<span>${ROLES[n].A.length}A·${ROLES[n].R.length}R</span></button>`).join('')}</div>
  <div class="focus"><p class="eyebrow">Selected role</p><h2>${esc(r)}</h2><p>Accountable for ${R.A.length} practices, responsible for ${R.R.length}, across ${new Set([...R.A,...R.R].map(p=>p.o.id)).size} objectives.</p>
   <div class="seg" role="group" aria-label="Filter"><button data-rf="all" aria-pressed="${f==='all'}">All</button><button data-rf="A" aria-pressed="${f==='A'}">Accountable</button><button data-rf="R" aria-pressed="${f==='R'}">Responsible</button></div>
   <div class="dbars">${dcount.map(([d,n])=>n?`<i class="d-${d}" style="width:${n/tot*100}%" title="${d}: ${n}"></i>`:'').join('')}</div>
   <div class="dleg">${dcount.map(([d,n])=>`<span class="d-${d}">${d} ${n}</span>`).join('')}</div></div>
  ${oids.map(id=>{const o=BY[id];return `<div class="rgroup d-${o.d}"><h3><a href="#${o.id}"><b>${o.id}</b> ${esc(o.n)}</a></h3><ul>${byO[id].map(x=>`<li><span class="pc">${x.p.id}</span><a href="#${x.p.id.replace('.','-')}">${esc(x.p.n)}</a><span class="ar ${x.t}">${x.t}</span></li>`).join('')}</ul></div>`}).join('')||'<p class="lede">Nothing in this filter.</p>'}
  ${foot}`;
}

// search
const IDX=[];
O.forEach(o=>{IDX.push({k:'Objectives',code:o.id,d:o.d,label:o.n,sub:D.domains[o.d],hay:(o.id+' '+o.n+' '+o.s).toLowerCase(),go:'#'+o.id});
  o.pr.forEach(p=>IDX.push({k:'Practices',code:p.id,d:o.d,label:p.n,sub:o.n,hay:(p.id+' '+p.n).toLowerCase(),go:'#'+p.id.replace('.','-')}));
  o.sk.forEach(s=>IDX.push({k:'Skills',code:o.id,d:o.d,label:s,sub:o.n,hay:s.toLowerCase(),go:'#'+o.id}));
  o.po.forEach(s=>IDX.push({k:'Policies',code:o.id,d:o.d,label:s,sub:o.n,hay:s.toLowerCase(),go:'#'+o.id}));
  o.sv.forEach(s=>IDX.push({k:'Tools & services',code:o.id,d:o.d,label:s,sub:o.n,hay:s.toLowerCase(),go:'#'+o.id}));});
roleNames.forEach(r=>IDX.push({k:'Roles',code:'ROLE',d:'',label:r,sub:`${ROLES[r].A.length} accountable · ${ROLES[r].R.length} responsible`,hay:r.toLowerCase(),role:r,go:'#roles'}));
[['eg',D.eg],['ag',D.ag]].forEach(([k,G])=>Object.entries(G).forEach(([c,n])=>IDX.push({k:'Goals',code:c,d:'',label:n,sub:k==='eg'?'Enterprise goal':'Alignment goal',hay:(c+' '+n).toLowerCase(),goal:c,go:'#goals'})));
const q=$('#q'), res=$('#results'); let sel=0, hits=[];
function search(){
  const t=q.value.trim().toLowerCase().replace(/\s+/g,' ');
  if(!t){res.hidden=true;return}
  const words=t.split(' ');
  hits=IDX.map(x=>{if(!words.every(w=>x.hay.includes(w)))return null;let s=0;if(x.code.toLowerCase()===t)s+=100;if(x.code.toLowerCase().startsWith(t))s+=50;if(x.label.toLowerCase().startsWith(t))s+=20;if(x.k==='Objectives')s+=5;return [s,x]}).filter(Boolean).sort((a,b)=>b[0]-a[0]).slice(0,40).map(a=>a[1]);
  const seen={};const groups={};hits.forEach(h=>{const key=h.k+h.label+h.code;if(seen[key])return;seen[key]=1;(groups[h.k]=groups[h.k]||[]).push(h)});
  hits=[];const order=['Objectives','Practices','Roles','Goals','Skills','Policies','Tools & services'];
  let html='';order.forEach(k=>{if(!groups[k])return;html+=`<h6>${k}</h6>`;groups[k].slice(0,8).forEach(h=>{html+=`<a href="${h.go}" class="d-${h.d}" data-i="${hits.length}"><span class="code">${h.code==='ROLE'?'Role':h.code}</span><span><span>${esc(h.label)}</span><br><span class="sub">${esc(h.sub)}</span></span></a>`;hits.push(h)})});
  res.innerHTML=html||`<div class="none">No matches. Try a code like DSS02 or a word like “vendor”.</div>`;res.hidden=false;sel=0;mark();
}
function mark(){res.querySelectorAll('a').forEach((a,i)=>a.classList.toggle('sel',i===sel))}
function pick(h){if(h.role)state.role=h.role,state.roleFilter='all';if(h.goal){state.goalKind=h.goal.slice(0,2).toLowerCase();state.goal=h.goal}save();res.hidden=true;q.value='';q.blur();go(h.go)}
q.addEventListener('input',search);
q.addEventListener('focus',search);
q.addEventListener('keydown',e=>{const n=res.querySelectorAll('a').length;
  if(e.key==='ArrowDown'){sel=Math.min(n-1,sel+1);mark();e.preventDefault()}
  else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);mark();e.preventDefault()}
  else if(e.key==='Enter'&&hits[sel]){pick(hits[sel]);e.preventDefault()}
  else if(e.key==='Escape'){res.hidden=true;q.blur()}});
res.addEventListener('click',e=>{const a=e.target.closest('a[data-i]');if(a){e.preventDefault();pick(hits[+a.dataset.i])}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.hidden=true});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}
  const h=CUR;if(BY[h]&&document.activeElement===document.body){if(e.key==='ArrowRight'&&O[BY[h].i+1])go(O[BY[h].i+1].id);if(e.key==='ArrowLeft'&&O[BY[h].i-1])go(O[BY[h].i-1].id)}});

// delegated clicks
main.addEventListener('click',e=>{
  const t=e.target;let el;
  if(el=t.closest('.prow')){togglePr(el);return}
  if(el=t.closest('[data-goal]')){const g=el.dataset.goal;state.goalKind=g.slice(0,2).toLowerCase();state.goal=g;save();return}
  if(el=t.closest('[data-gk]')){state.goalKind=el.dataset.gk;state.goal=Object.keys(D[state.goalKind])[0];save();renderGoals();return}
  if(el=t.closest('[data-goal-col]')){state.goal=el.dataset.goalCol;save();renderGoals();return}
  if(el=t.closest('[data-r]')){state.role=el.dataset.r;save();renderRoles();return}
  if(el=t.closest('[data-rf]')){state.roleFilter=el.dataset.rf;save();renderRoles();return}
  if(el=t.closest('button.role')){state.role=el.dataset.role;state.roleFilter='all';save();go('roles');return}
});

// drawer
const idx=$('#index'),scrim=$('#scrim'),ib=$('#idxBtn');
const drawer=on=>{idx.classList.toggle('open',on);scrim.hidden=!on;ib.setAttribute('aria-expanded',on)};
ib.onclick=()=>drawer(!idx.classList.contains('open'));scrim.onclick=()=>drawer(false);
idx.addEventListener('click',e=>{if(e.target.closest('a'))drawer(false)});

// router
let CUR='';
function go(h){
  h=(h||'').replace(/^#/,'');
  CUR=h;
  try{ if(location.hash.slice(1)!==h) history.pushState(null,'',h?'#'+h:location.pathname+location.search) }catch(e){}
  route(h);
}
document.addEventListener('click',e=>{
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;
  const a=e.target.closest('a[href^="#"]');if(!a)return;
  e.preventDefault();
  go(a.getAttribute('href'));
});
window.addEventListener('popstate',()=>route(location.hash.slice(1)));
function route(hh){
  let h=(hh!==undefined?hh:location.hash.slice(1)), view=h||'map', openPr=null;CUR=h;
  const m=h.match(/^([A-Z]{3}\d\d)-(\d\d)$/);
  if(m&&PR[m[1]+'.'+m[2]]){openPr=m[1]+'.'+m[2];h=m[1]}
  if(BY[h]){renderObj(h,openPr);view='obj'}
  else if(h==='goals')renderGoals();
  else if(h==='roles')renderRoles();
  else{renderMap();view='map'}
  document.querySelectorAll('.tabs a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.v===view)||a.dataset.v===view&&a.setAttribute('aria-current','page'));
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.v===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  idx.querySelectorAll('a').forEach(a=>{if(a.dataset.id===h)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const cur=idx.querySelector('[aria-current]');if(cur&&getComputedStyle(idx).position==='sticky')cur.scrollIntoView({block:'nearest'});
  if(!openPr)window.scrollTo(0,0);
  document.title=BY[h]?`${h} ${BY[h].n} · COBIT 2019 Navigator`:'COBIT 2019 Navigator';
}
buildIndex();
window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==CUR)route(location.hash.slice(1))});
route();
</script>
